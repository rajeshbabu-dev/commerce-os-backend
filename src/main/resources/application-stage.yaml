# =============================================================================
# Staging Profile
# =============================================================================
# For staging/pre-production environment.
# Scoped STAGE_* variable injections with standard fallbacks.
# =============================================================================

spring:
  datasource:
    url: ${STAGE_DB_URL:${STAGE_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}}
    username: ${STAGE_DB_USERNAME:${STAGE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME}}}
    password: ${STAGE_DB_PASSWORD:${STAGE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${STAGE_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:10}}
      minimum-idle: ${STAGE_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:2}}
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate  # Strict validation in staging
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${STAGE_REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${STAGE_REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      password: ${STAGE_REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
      ssl:
        enabled: ${STAGE_REDIS_SSL:${SPRING_DATA_REDIS_SSL:false}}

  rabbitmq:
    host: ${STAGE_RABBITMQ_HOST:${SPRING_RABBITMQ_HOST:localhost}}
    port: ${STAGE_RABBITMQ_PORT:${SPRING_RABBITMQ_PORT:5672}}
    username: ${STAGE_RABBITMQ_USERNAME:${SPRING_RABBITMQ_USERNAME:guest}}
    password: ${STAGE_RABBITMQ_PASSWORD:${SPRING_RABBITMQ_PASSWORD:guest}}
    virtual-host: ${STAGE_RABBITMQ_VIRTUAL_HOST:${SPRING_RABBITMQ_VIRTUAL_HOST:/}}
    ssl:
      enabled: ${STAGE_RABBITMQ_SSL:${SPRING_RABBITMQ_SSL:false}}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2

  mail:
    host: ${STAGE_MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
    port: ${STAGE_MAIL_PORT:${SPRING_MAIL_PORT:587}}
    username: ${STAGE_MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
    password: ${STAGE_MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:${PORT:8080}}

cors:
  allowed-origins: ${STAGE_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:*,http://127.0.0.1:*}}

jwt:
  secret: ${STAGE_JWT_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
  access-token-ttl: ${STAGE_JWT_ACCESS_TOKEN_TTL:${JWT_ACCESS_TOKEN_TTL:15m}}
  refresh-token-ttl: ${STAGE_JWT_REFRESH_TOKEN_TTL:${JWT_REFRESH_TOKEN_TTL:7d}}

llm:
  provider: ${STAGE_LLM_PROVIDER:${LLM_PROVIDER:claude}}
  api-key: ${STAGE_LLM_API_KEY:${LLM_API_KEY:dummy-key}}
  timeout: 10s

# Actuator - monitoring endpoints in staging
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.commerceos: INFO
    org.hibernate.SQL: WARN
    org.springframework: INFO
