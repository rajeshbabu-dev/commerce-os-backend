# =============================================================================
# Development Profile
# =============================================================================
# For local development with Docker Compose services.
# Uses relaxed settings suitable for rapid iteration.
# =============================================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commerceos}
    username: ${SPRING_DATASOURCE_USERNAME:commerceos}
    password: ${SPRING_DATASOURCE_PASSWORD:commerceos_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway manages schema — Hibernate only validates
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:vNhR5pdmd0I4+DnUlqFDH2MhGWGsbwoNg6icSzNHXnc=}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:900000}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:604800000}

llm:
  provider: ${LLM_PROVIDER:claude}
  api-key: ${LLM_API_KEY:}
  timeout: 8s

# Actuator - expose all endpoints in dev
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    com.commerceos: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
