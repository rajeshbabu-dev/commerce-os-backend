# =============================================================================
# CommerceOS - Base Application Configuration
# =============================================================================
# Profile-specific properties are in application-{dev,stage,prod}.yaml
# Sensitive values are injected from environment variables (.env file)
# =============================================================================

spring:
  application:
    name: commerceos
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA defaults (profile-specific overrides)
  jpa:
    open-in-view: false

  # Flyway migration locations
  flyway:
    locations: classpath:db/migration/iam,classpath:db/migration/inventory,classpath:db/migration/supplier,classpath:db/migration/procurement,classpath:db/migration/workflow,classpath:db/migration/recommendation,classpath:db/migration/analytics,classpath:db/migration/notification

# JWT defaults (profile-specific overrides)
jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:900000}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:604800000}

# LLM defaults (profile-specific overrides)
llm:
  provider: ${LLM_PROVIDER:claude}
  timeout: 8s

# Resilience4j circuit breaker configuration
resilience4j:
  circuitbreaker:
    instances:
      llmInsight:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  timelimiter:
    instances:
      llmInsight:
        timeout-duration: 8s