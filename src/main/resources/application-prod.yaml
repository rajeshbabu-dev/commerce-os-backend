# =============================================================================
# Production Profile
# =============================================================================
# For production environment.
# Scoped PROD_* variable injections with standard fallbacks.
# =============================================================================

spring:
  datasource:
    url: ${PROD_DB_URL:${PROD_DATASOURCE_URL:${SPRING_DATASOURCE_URL}}}
    username: ${PROD_DB_USERNAME:${PROD_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME}}}
    password: ${PROD_DB_PASSWORD:${PROD_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${PROD_DB_POOL_MAX_SIZE:${DB_POOL_MAX_SIZE:10}}
      minimum-idle: ${PROD_DB_POOL_MIN_IDLE:${DB_POOL_MIN_IDLE:2}}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate  # Never auto-modify schema in production
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  data:
    redis:
      host: ${PROD_REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${PROD_REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      password: ${PROD_REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}
      ssl:
        enabled: ${PROD_REDIS_SSL:${SPRING_DATA_REDIS_SSL:true}}

  rabbitmq:
    host: ${PROD_RABBITMQ_HOST:${SPRING_RABBITMQ_HOST:localhost}}
    port: ${PROD_RABBITMQ_PORT:${SPRING_RABBITMQ_PORT:5672}}
    username: ${PROD_RABBITMQ_USERNAME:${SPRING_RABBITMQ_USERNAME:guest}}
    password: ${PROD_RABBITMQ_PASSWORD:${SPRING_RABBITMQ_PASSWORD:guest}}
    virtual-host: ${PROD_RABBITMQ_VIRTUAL_HOST:${SPRING_RABBITMQ_VIRTUAL_HOST:/}}
    ssl:
      enabled: ${PROD_RABBITMQ_SSL:${SPRING_RABBITMQ_SSL:false}}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2

  mail:
    host: ${PROD_MAIL_HOST:${SPRING_MAIL_HOST:smtp.gmail.com}}
    port: ${PROD_MAIL_PORT:${SPRING_MAIL_PORT:587}}
    username: ${PROD_MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
    password: ${PROD_MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:${PORT:8080}}

cors:
  allowed-origins: ${PROD_CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:https://*.vercel.app,http://localhost:*,http://127.0.0.1:*}}

jwt:
  secret: ${PROD_JWT_SECRET:${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
  access-token-ttl: ${PROD_JWT_ACCESS_TOKEN_TTL:${JWT_ACCESS_TOKEN_TTL:15m}}
  refresh-token-ttl: ${PROD_JWT_REFRESH_TOKEN_TTL:${JWT_REFRESH_TOKEN_TTL:7d}}

llm:
  provider: ${PROD_LLM_PROVIDER:${LLM_PROVIDER:claude}}
  api-key: ${PROD_LLM_API_KEY:${LLM_API_KEY:dummy-key}}
  timeout: 15s

# Actuator - minimal endpoints in production
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.commerceos: INFO
    org.hibernate.SQL: ERROR
    org.springframework: INFO
    root: INFO
